# Deploy Laravel to Hostinger shared hosting (voting.asesewagovhospital.com)
#
# Separates Laravel core (/public_html/backend) from public files (/public_html).
# No SSH — FTPS only. Vendor is a separate long-running job.
#
# Required GitHub Secrets:
#   FTP_SERVER
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_PORT          (optional, defaults to 21)
#
# One-time on the server:
#   1. Place production .env in /public_html/backend/.env
#   2. chmod -R 775 /public_html/backend/storage /public_html/backend/bootstrap/cache
#   3. Ensure PHP 8.3+ for voting.asesewagovhospital.com
#   4. Create storage link if needed:
#      public_html/storage -> backend/storage/app/public

name: Deploy Voting App to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: voting-hostinger-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, bcmath, intl, fileinfo, mysql, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare storage folders
        run: |
          mkdir -p \
            storage/app/public \
            storage/app/private \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            bootstrap/cache
          # Placeholder files so FTPS creates the directories (empty dirs are skipped).
          touch \
            storage/app/public/.gitkeep \
            storage/app/private/.gitkeep \
            storage/framework/cache/.gitkeep \
            storage/framework/cache/data/.gitkeep \
            storage/framework/sessions/.gitkeep \
            storage/framework/views/.gitkeep \
            storage/logs/.gitkeep \
            bootstrap/cache/.gitkeep
          # Do not ship compiled views / local env
          find storage/framework/views -type f ! -name '.gitignore' ! -name '.gitkeep' -delete || true
          rm -f .env .env.backup .env.production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voting-hostinger-build
          path: |
            app
            bootstrap
            config
            database
            public
            resources
            routes
            storage
            vendor
            artisan
            composer.json
            composer.lock
          retention-days: 1
          if-no-files-found: error

  deploy-app:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: voting-hostinger-build
          path: app

      - name: Deploy Laravel core files to /backend
        uses: Wandalen/wretry.action@v3.5.0
        with:
          action: SamKirkland/FTP-Deploy-Action@v4.3.6
          attempt_limit: 5
          attempt_delay: 30000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            protocol: ftps
            port: ${{ secrets.FTP_PORT || 21 }}
            timeout: 300000
            log-level: standard
            state-name: .ftp-deploy-sync-state-app.json
            local-dir: ./app/
            server-dir: /public_html/backend/
            exclude: |
              **/.git
              **/.git/**
              **/node_modules/**
              **/.env
              **/.env.*
              **/tests/**
              **/.phpunit.cache
              **/.phpunit.result.cache
              **/.github/**
              **/storage/logs/*.log
              **/storage/framework/testing/**
              **/.idea/**
              **/.vscode/**
              **/phpunit.xml
              **/Homestead.json
              **/Homestead.yaml
              **/auth.json
              **/package.json
              **/package-lock.json
              **/vite.config.js
              public/**
              vendor/**

      - name: Deploy public folder to /public_html/
        uses: Wandalen/wretry.action@v3.5.0
        with:
          action: SamKirkland/FTP-Deploy-Action@v4.3.6
          attempt_limit: 5
          attempt_delay: 30000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            protocol: ftps
            port: ${{ secrets.FTP_PORT || 21 }}
            timeout: 300000
            log-level: standard
            state-name: .ftp-deploy-sync-state-public.json
            local-dir: ./app/public/
            server-dir: /public_html/
            exclude: |
              **/.git
              **/.git/**

  deploy-vendor:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: voting-hostinger-build
          path: app

      - name: Deploy Composer vendor to /backend/vendor
        uses: Wandalen/wretry.action@v3.5.0
        with:
          action: SamKirkland/FTP-Deploy-Action@v4.3.6
          attempt_limit: 5
          attempt_delay: 60000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            protocol: ftps
            port: ${{ secrets.FTP_PORT || 21 }}
            timeout: 300000
            log-level: minimal
            state-name: .ftp-deploy-sync-state-vendor.json
            local-dir: ./app/vendor/
            server-dir: /public_html/backend/vendor/
            exclude: |
              **/.git
              **/.git/**
              **/tests/**
              **/Tests/**
              **/docs/**
              **/doc/**
              **/examples/**
              **/example/**
              **/phpunit.xml*
              **/.github/**

  deploy-summary:
    needs:
      - deploy-app
      - deploy-vendor
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          if [ "${{ needs.deploy-app.result }}" != "success" ] || [ "${{ needs.deploy-vendor.result }}" != "success" ]; then
            echo "Deployment did not fully succeed."
            echo "deploy-app: ${{ needs.deploy-app.result }}"
            echo "deploy-vendor: ${{ needs.deploy-vendor.result }}"
            exit 1
          fi
          echo "Deployment completed successfully!"
          echo ""
          echo "Laravel core files deployed to: /public_html/backend/"
          echo "Composer vendor deployed to: /public_html/backend/vendor/"
          echo "Public files deployed to: /public_html/"
          echo ""
          echo "Post-deployment checklist:"
          echo "  1. Ensure .env exists in /public_html/backend/"
          echo "  2. chmod -R 775 /public_html/backend/storage /public_html/backend/bootstrap/cache"
          echo "  3. Link storage if needed: public_html/storage -> backend/storage/app/public"
          echo "  4. Run migrations once (hPanel cron or temporary route): php artisan migrate --force"
